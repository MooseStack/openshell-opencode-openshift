# Red Hat build of Agent Sandbox Operator (OLM).
# Installs the Sandbox CRD/controller; does not configure Kata or a VM runtime.
# Requires the redhat-operators CatalogSource in openshift-marketplace.
# If Agent Sandbox is already installed, reuse it rather than install a second controller.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandbox-system
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: agent-sandbox
  namespace: agent-sandbox-system
# Empty target namespace selection means all namespaces on the cluster.
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: agent-sandbox-operator
  namespace: agent-sandbox-system
spec:
  name: agent-sandbox-operator
  channel: preview-0.9
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Automatic approval minimizes setup; OLM also applies channel updates.
  installPlanApproval: Automatic
